<meta charset="utf-8">
<title>Redis real-time decisions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: two four-slide sections of 16:9 slides (stacked cards below 760px); Redis brand, dark-only: Midnight ground, Dusk depth, Hyper for Redis and the hot path, highlighter hues as small accents */
:root{
  --bg:#091A23; --slide:#07151C; --panel:#0D212C; --ink:#F3F3F3; --muted:#8A99A0; --line:#2D4754; --soft:#163341;
  --hyper:#FF4438; --hyper-text:#FD736A; --violet:#C795E3; --sky:#80DBFF; --yellow:#DCFF1E; --ok:#80DBFF;
  --grotesk:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--grotesk);line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:1280px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- Stage ---------- */
.stage{container-type:inline-size;width:100%;max-width:calc((100vh - 120px) * 16 / 9);margin:0 auto}
/* ponytail: aspect-ratio with visible overflow grows the slide if content runs long, instead of clipping it */
.slide{display:none;position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 100% 0,rgba(255,68,56,.12),transparent 32%),var(--slide);border:1px solid var(--line);border-radius:14px;
  font-size:1.3cqw;padding:2.6em 3.2em 3em;flex-direction:column;gap:1.1em}
.slide.on{display:flex;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.head{display:flex;flex-direction:column;gap:.35em;max-width:62em}
.eyebrow{font-family:var(--mono);font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--hyper-text);margin:0}
h2{font-size:2.2em;line-height:1.05;letter-spacing:-.025em;margin:0;text-wrap:balance}
.lede{color:var(--muted);font-size:1.08em;margin:0;max-width:52em}
.foot{position:absolute;left:3.2em;right:3.2em;bottom:1.1em;display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* ---------- Slide 1: one swipe ---------- */
.examples{display:flex;flex-wrap:wrap;gap:.6em;align-items:center}
.examples .lbl{font-family:var(--mono);font-size:.75em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:.4em}
.chipbtn{border:1px solid var(--line);border-radius:999px;padding:.45em 1em;font-size:.9em;color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pipe{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:1em;flex:1;min-height:0;padding-top:1.6em;margin-bottom:.5em}
.rail{position:absolute;left:10%;right:10%;top:.55em;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.rail .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--hyper);transition:width 1.1s cubic-bezier(.6,0,.2,1)}
.token{position:absolute;top:0;left:10%;width:1.1em;height:1.1em;margin-left:-.55em;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 .25em rgba(220,255,30,.2);transition:left 1.1s cubic-bezier(.6,0,.2,1)}
.stn{position:relative;display:flex;flex-direction:column;gap:.55em;padding:2.1em 1.1em 1.1em;border:1px solid var(--line);border-radius:10px;background:var(--panel);opacity:.45;transition:opacity .35s,border-color .35s,background-color .35s;min-width:0}
.stn.on{opacity:1}
.stn.now{border-color:var(--hyper)}
.stn.redis{background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(var(--hyper),var(--hyper)) border-box}
.stn .ic{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.stn.redis .ic{background:var(--hyper)}
.stn .ic svg{width:1.4em;height:1.4em;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stn.redis .ic svg{stroke:#091A23}
.stn .t{font-weight:700;font-size:1.12em;line-height:1.15}
.stn .d{font-size:.9em;color:var(--muted)}
.stn .live{font-size:.92em;min-height:3.2em;display:flex;flex-direction:column;gap:.35em}
.stn .ms{position:absolute;top:.75em;right:.9em;font-family:var(--mono);font-size:.75em;color:var(--muted)}
.stn .who{font-family:var(--mono);font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stn.redis .who{color:var(--hyper-text)}
.sig{display:flex;gap:.45em;align-items:baseline;font-size:.92em}
.sig i{font-style:normal;font-family:var(--mono);font-size:.85em;width:1em;flex:none}
.sig.ok i{color:var(--ok)} .sig.bad i{color:var(--hyper-text)}
.risk{display:flex;flex-direction:column;gap:.35em}
.risk .bar{height:.55em;border-radius:3px;background:var(--soft);overflow:hidden}
.risk .bar b{display:block;height:100%;width:0;background:var(--sky);transition:width .6s ease}
.risk .num{font-family:var(--mono);font-size:1.6em;font-weight:700;line-height:1}
.pill{display:inline-block;align-self:flex-start;font-family:var(--mono);font-weight:700;font-size:.82em;letter-spacing:.04em;padding:.35em .8em;border-radius:6px;text-transform:uppercase}
.pill.approve{background:var(--sky);color:#091A23} .pill.decline{background:var(--hyper);color:#091A23} .pill.step{background:var(--yellow);color:#091A23}
.result{display:flex;flex-wrap:wrap;align-items:center;gap:.6em 1.6em;border-top:1px solid var(--line);padding-top:1em;margin-bottom:1.2em}
.clock{font-family:var(--mono);font-size:2.6em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:4.6ch}
.result .txt{flex:1;min-width:14em;font-size:1em;color:var(--muted)}
.result .txt b{color:var(--ink)}
.blink{display:flex;flex-direction:column;gap:.3em;min-width:16em}
.blink .row{display:flex;align-items:center;gap:.6em;font-family:var(--mono);font-size:.72em;color:var(--muted)}
.blink .row span:first-child{width:7.5em}
.blink .b{height:.5em;border-radius:3px}
.replay{font-family:var(--mono);font-size:.78em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);border-radius:6px;padding:.6em 1em}

/* ---------- Slide 2 + 3: clickable diagram ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1.6em;flex:1;margin-bottom:1.4em}
.diagram{display:flex;flex-direction:column;gap:.7em}
.s-stack .head{gap:.25em}
.s-stack .lane .ext{padding:.4em .7em}
.s-stack .lane .ext span{display:none}
.s-stack .lane .ext b{font-size:.92em}
.s-stack .detail{max-height:31em}
.lane{display:flex;align-items:stretch;gap:.6em}
.lane .tag{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:.66em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.flowrow{display:flex;align-items:center;gap:.5em;flex:1;min-width:0}
.flowrow .ar{color:var(--muted);font-family:var(--mono);flex:none}
.ext{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:.6em .8em;font-size:.88em;background:var(--panel)}
.ext b{display:block;font-size:1.02em}
.ext span{color:var(--muted);font-size:.9em}
.ext.redis{border-color:var(--hyper)}
.ext.redis b{color:var(--hyper-text)}
.rframe{position:relative;border:1px solid var(--hyper);border-radius:12px;padding:1.8em .9em .8em;display:flex;flex-direction:column;gap:.45em;background:linear-gradient(180deg,rgba(255,68,56,.06),transparent 60%)}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5em}
.types .comp{padding:.5em .65em;gap:.15em}
.types .comp b{font-size:.86em;font-weight:500}
.types .comp .k{font-size:.58em}
.types .comp::after{top:.6em;right:.55em;width:.4em;height:.4em}
.comp .opt{position:absolute;right:.5em;bottom:.45em;font-family:var(--mono);font-size:.58em;letter-spacing:.06em;text-transform:uppercase;color:var(--violet)}
.layer-note{font-family:var(--mono);font-size:.62em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.comp.bar{flex-direction:row;align-items:baseline;gap:.8em;flex-wrap:wrap;padding:.55em .9em}
.comp.bar .k{flex:none}
.comp.bar>span:last-child{flex:1 1 20em}
.srcrow .comp{padding:.45em .7em}
.srcrow .comp>span:last-child{display:none}
.mention{margin:.1em 0 0;font-size:.8em;color:var(--muted)}
.mention b{color:var(--ink);font-weight:500}
.up{display:flex;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:.8em;line-height:1;margin:-.2em 0}
.srcrow{display:flex;gap:.5em;align-items:stretch}
.srcrow .comp{flex:1;background:var(--panel);border-style:solid}
.srcrow .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:.6em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.rframe .plat{position:absolute;left:1em;top:.6em;font-family:var(--mono);font-size:.7em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hyper-text)}
.comp{position:relative;text-align:left;border:1px solid var(--line);border-radius:8px;padding:.7em .85em;background:var(--soft);display:flex;flex-direction:column;gap:.25em;transition:border-color .2s,background-color .2s,transform .2s;min-width:0}
.comp:hover{border-color:var(--muted);transform:translateY(-1px)}
.comp b{font-size:1em;line-height:1.15}
.comp span{font-size:.82em;color:var(--muted);line-height:1.25}
.comp .k{font-family:var(--mono);font-size:.64em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.comp::after{content:"";position:absolute;right:.7em;top:.75em;width:.5em;height:.5em;border-radius:50%;background:var(--dot,var(--line))}
.comp.hero{padding:.9em 1em;background:var(--hyper);border-color:var(--hyper);color:#091A23;--dot:#091A23}
.comp.hero span,.comp.hero .k{color:#091A23;opacity:.78}
.comp[aria-pressed="true"]{box-shadow:0 0 0 2px var(--yellow),0 0 0 4px var(--bg)}
.d-violet{--dot:var(--violet)} .d-sky{--dot:var(--sky)} .d-yellow{--dot:var(--yellow)}
.comp.bg{background:transparent;border-style:dashed}
.hint{font-family:var(--mono);font-size:.68em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.detail{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:1.3em 1.4em;display:flex;flex-direction:column;gap:.9em;min-height:0;overflow:auto}
.detail .k{font-family:var(--mono);font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--hyper-text)}
.detail h3{font-size:1.5em;line-height:1.1;margin:0;letter-spacing:-.015em}
.detail p{margin:0;font-size:.95em}
.detail .sec{display:flex;flex-direction:column;gap:.35em}
.detail .sec>span{font-family:var(--mono);font-size:.66em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.detail ul{margin:0;padding-left:1.1em;font-size:.92em;display:flex;flex-direction:column;gap:.25em}
.detail .eg{font-family:var(--mono);font-size:.8em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.7em .8em;white-space:pre-wrap;color:var(--ink)}
.detail.fresh>*{animation:in .35s ease both}

/* Slide 3 pipeline */
.ffrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6em;align-items:stretch}
.ffstep{text-align:left;border:1px solid var(--line);border-radius:8px;padding:.8em .85em;background:var(--soft);display:flex;flex-direction:column;gap:.3em;position:relative;min-width:0;transition:border-color .2s,transform .2s}
.ffstep:hover{border-color:var(--muted);transform:translateY(-1px)}
.ffstep .n{font-family:var(--mono);font-size:.7em;color:var(--muted)}
.ffstep b{font-size:1em;line-height:1.15}
.ffstep span{font-size:.82em;color:var(--muted)}
.ffstep.ff{border-color:var(--violet)}
.ffstep.ff .n{color:var(--violet)}
.ffstep.redis{background:var(--hyper);border-color:var(--hyper);color:#091A23}
.ffstep.redis span,.ffstep.redis .n{color:#091A23;opacity:.78}
.ffstep[aria-pressed="true"]{box-shadow:0 0 0 2px var(--yellow),0 0 0 4px var(--bg)}
.ffstep:not(:last-child)::after{content:"→";position:absolute;right:-.62em;top:50%;transform:translate(50%,-50%);color:var(--muted);font-family:var(--mono);font-size:.9em}
.bracket{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6em;margin-top:-.3em}
.bracket div{grid-column:2 / span 3;border:1px solid var(--violet);border-top:0;border-radius:0 0 8px 8px;height:.8em}
.bracket p{grid-column:2 / span 3;margin:.2em 0 0;text-align:center;font-family:var(--mono);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.featcard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.featcard div{padding:.75em .9em;border-right:1px solid var(--line);min-width:0}
.featcard div:last-child{border-right:0}
.featcard span{display:block;font-family:var(--mono);font-size:.64em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.25em}
.featcard b{font-size:.92em;font-weight:500}
.featcard .nm b{font-family:var(--mono);font-weight:700;color:var(--yellow);overflow-wrap:anywhere}
.wins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8em}
.wins div{border-left:2px solid var(--violet);padding:.1em 0 .1em .8em;font-size:.9em;color:var(--muted)}
.wins b{display:block;color:var(--ink);font-size:1.02em}

/* Slide 3: disk-based race */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.8em 1.6em;font-size:.9em}
.controls label{display:flex;align-items:center;gap:.6em;color:var(--muted)}
.controls output{font-family:var(--mono);color:var(--ink);min-width:2ch}
.controls input[type=range]{accent-color:var(--hyper);width:11em}
.controls input[type=checkbox]{accent-color:var(--hyper);width:1.1em;height:1.1em}
.race{display:flex;flex-direction:column;gap:.55em}
.lanebtn{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr) 5.5em;align-items:center;gap:1em;text-align:left;border:1px solid var(--line);border-radius:8px;padding:.6em .8em;background:var(--panel);transition:border-color .2s}
.lanebtn:hover{border-color:var(--muted)}
.lanebtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--yellow),0 0 0 4px var(--bg)}
.lanebtn .nm b{display:block;font-size:1em;line-height:1.15}
.lanebtn .nm span{font-size:.78em;color:var(--muted)}
.lanebtn.us{border-color:var(--hyper)}
.lanebtn.us .nm b{color:var(--hyper-text)}
.ltrack{position:relative;height:1.4em;border-radius:4px;background:var(--soft);overflow:hidden}
.ltrack .lf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--line)}
.lanebtn.us .ltrack .lf{background:var(--hyper)}
.ltrack .lf.over{background:repeating-linear-gradient(135deg,var(--muted) 0 5px,transparent 5px 10px)}
.ltrack .bud{position:absolute;top:-2px;bottom:-2px;border-left:2px solid var(--ink)}
.lclock{font-family:var(--mono);font-weight:700;font-size:1.05em;text-align:right;font-variant-numeric:tabular-nums}
.lclock.bad{color:var(--hyper-text)}
.racefoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4em 1em;font-family:var(--mono);font-size:.66em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.where{display:inline-flex;gap:.3em;margin-top:.2em}
.where i{font-style:normal;font-family:var(--mono);font-size:.62em;letter-spacing:.06em;text-transform:uppercase;padding:.15em .45em;border-radius:3px;background:var(--soft);color:var(--muted)}
.where i.ram{background:var(--hyper);color:#091A23}
.where i.ssd{background:var(--sky);color:#091A23}

/* ---------- Nav ---------- */
.nav{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.nav .arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.nav .arrow:disabled{opacity:.3;cursor:default}
.nav .arrow svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:2}
.dots{display:flex;gap:6px}
.dots button{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted)}
.dots .n{font-family:var(--mono);font-size:11px}
.dots button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots button[aria-current="true"] .n{color:var(--hyper)}

/* ---------- Phone and narrow windows: slides become stacked cards ---------- */
@media (max-width:760px){
  .stage{max-width:none}
  .slide{aspect-ratio:auto;font-size:14px;padding:22px 18px 46px}
  h2{font-size:26px}
  .pipe{grid-template-columns:1fr;padding-top:0}
  .rail,.token{display:none}
  .stn{padding:14px}
  .split{grid-template-columns:1fr}
  .types{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srcrow{flex-wrap:wrap}
  .srcrow .lbl{display:none}
  .lane .tag{display:none}
  .flowrow{flex-wrap:wrap}
  .ffrow{grid-template-columns:1fr}
  .ffstep:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-1.1em;transform:translateX(-50%)}
  .ffrow{gap:1.2em}
  .bracket{display:none}
  .featcard{grid-template-columns:1fr 1fr}
  .featcard div:nth-child(2){border-right:0}
  .featcard div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .wins{grid-template-columns:1fr}
  .lanebtn{grid-template-columns:1fr auto}
  .lanebtn .ltrack{grid-column:1 / -1;grid-row:2}
  .dots .t{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>

<style>
.pill.offer{background:var(--sky);color:#091A23;text-transform:none;letter-spacing:0;font-size:.85em}
.dots{align-items:center;flex-wrap:wrap;justify-content:center}
.dots .grp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 4px 0 10px}
.dots .grp:first-child{margin-left:0}
.dots button{padding:8px 11px}
.dots button .t{display:none}
.dots button[aria-current="true"] .t{display:inline}
@media (max-width:760px){ .dots .grp{display:none} .dots button[aria-current="true"] .t{display:none} }
</style>

<div class="wrap">
<div class="stage" id="stage"></div>
<nav class="nav" aria-label="Slides">
  <button class="arrow" id="prev" aria-label="Previous slide"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next" aria-label="Next slide"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
</nav>
</div>

<script>
const $=id=>document.getElementById(id);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");

const ICON={
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  bank:'<path d="M3 10h18L12 4zM5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/>',
  look:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
  gauge:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 17 4-5"/>',
  reply:'<path d="M20 6 9 17l-5-5"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  rank:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

/* ================= Slide builders ================= */
const stage=$("stage"), SLIDES=[], ON_SHOW=[];
let num=0;
function slide(sec, part, label){
  num++; const el=document.createElement("section");
  el.className="slide s-"+part; el.id="s"+num; el.setAttribute("aria-label",`Slide ${num}: ${label}`);
  stage.appendChild(el); SLIDES.push({el, sec, title:label}); return el;
}
function head(s,n){ return `<div class="head"><p class="eyebrow">${pad(n)} · ${s.eyebrow}</p><h2>${s.h2}</h2><p class="lede">${s.lede}</p></div>`; }
function fresh(d){ d.classList.remove("fresh"); void d.offsetWidth; d.classList.add("fresh"); }

function buildSwipe(sec){
  const S=sec.swipe, el=slide(sec,"swipe",S.eyebrow), n=num, total=S.stations.reduce((a,s)=>a+s.ms,0);
  el.innerHTML=head(S,n)+`
  <div class="examples" role="group" aria-label="Examples"><span class="lbl">${S.tryLabel}</span>${S.examples.map(e=>`<button class="chipbtn" data-ex="${e.id}">${e.label}</button>`).join("")}</div>
  <div class="pipe"><div class="rail"><div class="fill"></div></div><div class="token"></div>${S.stations.map((s,i)=>`
    <div class="stn${s.redis?" redis":""}"><span class="ms">${i?"+"+s.ms+"ms":"0ms"}</span><span class="ic"><svg viewBox="0 0 24 24">${ICON[s.ic]}</svg></span><span class="who">${s.who}</span><span class="t">${s.t}</span><span class="d">${s.d}</span><div class="live"></div></div>`).join("")}</div>
  <div class="result"><span class="clock">0ms</span><span class="txt">Pick an example to watch it go through.</span>
    <div class="blink" aria-hidden="true"><div class="row"><span>${S.checkLabel}</span><span class="b" style="width:${(total/300*8.8).toFixed(1)}em;background:var(--hyper)"></span><span>~${total}ms</span></div><div class="row"><span>A blink</span><span class="b" style="width:8.8em;background:var(--line)"></span><span>~300ms</span></div></div>
    <button class="replay">Replay</button></div>
  <div class="foot"><span>${sec.foot}</span><span>Timings illustrative</span></div>`;
  const STN=[...el.querySelectorAll(".stn")], q=c=>el.querySelector(c);
  const live=(i,ex)=>{
    if(i===0) return `<span>${esc(ex.pay)}</span>`;
    if(i===1) return `<span class="d">${S.stations[1].live}</span>`;
    if(i===2) return ex.sig.map(([k,t])=>`<span class="sig ${k}"><i>${k==="ok"?"✓":"!"}</i>${esc(t)}</span>`).join("");
    if(i===3) return `<div class="risk"><span class="num">${ex.score}<span class="d" style="font-size:.5em"> / 100 ${S.scoreLabel}</span></span><div class="bar"><b></b></div></div>`;
    return `<span class="pill ${ex.out[0]}">${esc(ex.out[1])}</span>`;
  };
  let runId=0, cur=S.examples[0].id;
  async function run(key){
    cur=key; const id=++runId, ex=S.examples.find(e=>e.id===key);
    el.querySelectorAll("[data-ex]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ex===key));
    STN.forEach(s=>{ s.classList.remove("on","now"); s.querySelector(".live").innerHTML=""; });
    q(".fill").style.width="0"; q(".token").style.left="10%"; q(".clock").textContent="0ms"; q(".txt").innerHTML="Working…";
    let ms=0;
    for(let i=0;i<STN.length;i++){
      if(id!==runId) return;
      const st=STN[i], from=ms; ms+=S.stations[i].ms;
      STN.forEach(s=>s.classList.remove("now")); st.classList.add("on","now");
      st.querySelector(".live").innerHTML=live(i,ex);
      q(".token").style.left=(10+i*20)+"%"; q(".fill").style.width=(i/4*100)+"%";
      if(i===3) requestAnimationFrame(()=>{ const b=st.querySelector(".bar b"), good=S.highIsGood?ex.score:100-ex.score;
        b.style.width=ex.score+"%"; b.style.background=good>60?"var(--sky)":good>20?"var(--yellow)":"var(--hyper)"; });
      const dur=REDUCED?0:Math.max(1500,S.stations[i].ms*45), t0=performance.now();
      while(true){ const p=dur?Math.min(1,(performance.now()-t0)/dur):1; q(".clock").textContent=Math.round(from+(ms-from)*p)+"ms"; if(p>=1||id!==runId) break; await sleep(40); }
    }
    if(id!==runId) return;
    STN.forEach(s=>s.classList.remove("now"));
    q(".txt").innerHTML=ex.txt+` Redis took ${S.stations[2].ms}ms of the ${ms}ms.`;
  }
  el.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>run(b.dataset.ex));
  q(".replay").onclick=()=>run(cur);
  ON_SHOW[SLIDES.length-1]=()=>run(cur);
}

    <div class="rframe" role="group" aria-label="Redis components"><span class="plat">Redis · tap a layer</span>

      <p class="mention"><b>Always on:</b> ${S.mention}</p></div>
    <div class="up" aria-hidden="true">↑</div><span class="layer-note">Systems of record</span><div class="srcrow" data-l="src"></div>
  </div><aside class="detail" aria-live="polite"></aside></div>
  <div class="foot"><span>${sec.foot}</span><span>${S.footR}</span></div>`;
  const d=el.querySelector(".detail");
  const pick=id=>{
    const c=S.comps.find(x=>x.id===id);
    el.querySelectorAll(".comp").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
    d.innerHTML=`<span class="k">${c.k}</span><h3>${c.n}</h3><p>${c.what}</p>
      <div class="sec"><span>${c.layer==="src"?"Example":"In this request"}</span><div class="eg">${esc(c.eg)}</div></div>
      <div class="sec"><span>${c.layer==="src"?"How it connects":"Why Redis"}</span><ul>${c.why.map(w=>`<li>${w}</li>`).join("")}</ul></div>`;
    fresh(d);
  };
  S.comps.forEach(c=>{
    const b=document.createElement("button");
    b.className="comp"+(c.hero?" hero bar":"")+(c.bar?" bar":"")+(c.dot?" "+c.dot:"");
    b.dataset.id=c.id; b.setAttribute("aria-pressed","false");

      ? `<span class="k">${c.k}</span><b>${c.n}</b>${c.opt?'<span class="opt">Optional</span>':""}`
      : `<span class="k">${c.k}</span><b>${c.n}</b><span>${c.s}</span>`;
    b.onclick=()=>pick(c.id);
    el.querySelector(`[data-l="${c.layer}"]`).appendChild(b);
  });
  pick("flex");
}

      <button class="replay">Race</button></div>
    <div class="race" role="group" aria-label="Lookup race">${RIVAL.map(r=>`
      <button class="lanebtn${r.us?" us":""}" data-id="${r.id}" aria-pressed="false"><span class="nm"><b>${r.n}</b><span>${r.s}</span><span class="where">${r.where.map(([c,t])=>`<i class="${c}">${t}</i>`).join("")}</span></span>
      <span class="ltrack"><span class="lf"></span><span class="bud"></span></span><span class="lclock">0ms</span></button>`).join("")}</div>
    <div class="racefoot"><span>Time to fetch features · line marks 100ms total budget</span><span>Illustrative, not a benchmark</span></div>
  </div><aside class="detail" aria-live="polite"></aside></div>
  <div class="foot"><span>${sec.foot}</span><span>Validate with a customer benchmark</span></div>`;
  const d=el.querySelector(".detail"), lanes=[...el.querySelectorAll(".lanebtn")], range=$(uid+"-n"), peakEl=$(uid+"-p");
  const pick=id=>{ const r=RIVAL.find(x=>x.id===id);
    lanes.forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
    d.innerHTML=`<span class="k">${r.us?"Redis":"Disk-based"}</span><h3>${r.n}</h3><p>${r.what}</p><div class="sec"><span>${r.us?"Why it wins":"Where it hurts"}</span><ul>${r.pts.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
    fresh(d); };
  lanes.forEach(b=>b.onclick=()=>pick(b.dataset.id));
  const fmt=ms=>ms<10?ms.toFixed(1)+"ms":Math.round(ms)+"ms";
  let raceId=0;
  async function race(){
    const id=++raceId, k=+range.value, peak=peakEl.checked;
    const tot=RIVAL.map(r=>k*r.ms*(peak?r.peak:1)), max=Math.max(...tot), scale=Math.max(120,max*1.08);
    lanes.forEach(b=>b.querySelector(".bud").style.left=(100/scale*100)+"%");
    const T=REDUCED?0:Math.min(4500,Math.max(1800,max*30)), t0=performance.now();
    while(true){
      const p=T?Math.min(1,(performance.now()-t0)/T):1, now=p*max;
      lanes.forEach((b,i)=>{ const v=Math.min(tot[i],now), f=b.querySelector(".lf"), c=b.querySelector(".lclock");
        f.style.width=(v/scale*100)+"%"; f.classList.toggle("over",v>100); c.textContent=fmt(v); c.classList.toggle("bad",v>100); });
      if(p>=1||id!==raceId) break;
      await sleep(30);
    }
  }
  range.oninput=()=>{ el.querySelector("output").textContent=range.value; race(); };
  peakEl.onchange=race; el.querySelector(".replay").onclick=race;
  pick("redis");
  ON_SHOW[SLIDES.length-1]=race;
}

function buildFF(sec){
  const S=sec.ff, el=slide(sec,"ff",S.eyebrow), n=num;
  el.innerHTML=head(S,n)+`
  <div class="split"><div class="diagram">
    <div class="ffrow" role="group" aria-label="Feature Form steps">${S.steps.map((f,i)=>`<button class="ffstep${f.ff?" ff":""}${f.redis?" redis":""}" data-id="${f.id}" aria-pressed="false"><span class="n">${pad(i+1)}</span><b>${f.n}</b><span>${f.s}</span></button>`).join("")}</div>
    <div class="bracket" aria-hidden="true"><div></div><p>Redis Feature Form</p></div>
    <div class="featcard" aria-label="Example feature"><div class="nm"><span>Example feature</span><b>${S.feat[0][0]}</b></div>${S.feat.slice(1).map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div>
    <div class="wins">${FF_WINS.map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join("")}</div>
  </div><aside class="detail" aria-live="polite"></aside></div>
  <div class="foot"><span>${sec.foot}</span><span>Redis Feature Form</span></div>`;
  const d=el.querySelector(".detail");
  const pick=id=>{ const f=S.steps.find(x=>x.id===id);
    el.querySelectorAll(".ffstep").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
    d.innerHTML=`<span class="k">${f.redis?"Redis Flex":f.ff?"Redis Feature Form":"Your systems"}</span><h3>${f.n}</h3><p>${f.what}</p><div class="sec"><span>What it means for you</span><ul>${f.pts.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
    fresh(d); };
  el.querySelectorAll(".ffstep").forEach(b=>b.onclick=()=>pick(b.dataset.id));
  pick("serve");
}

SECTIONS.forEach(sec=>{ buildSwipe(sec); buildStack(sec); buildRace(sec); buildFF(sec); });

/* ================= Navigation ================= */
const SHORT=["How it works","Redis implementation","Versus disk","Feature Form"];
$("dots").innerHTML=SECTIONS.map((sec,si)=>`<span class="grp">${sec.label}</span>`+SHORT.map((t,j)=>{ const i=si*4+j; return `<button data-s="${i}" title="${sec.label}: ${t}"><span class="n">${pad(i+1)}</span><span class="t">${t}</span></button>`; }).join("")).join("");
let at=0;
function go(i){
  at=Math.max(0,Math.min(SLIDES.length-1,i));
  SLIDES.forEach((s,j)=>s.el.classList.toggle("on",j===at));
  document.querySelectorAll("#dots button").forEach((b,j)=>b.setAttribute("aria-current",j===at));
  $("prev").disabled=at===0; $("next").disabled=at===SLIDES.length-1;
  if(ON_SHOW[at]) ON_SHOW[at]();
}
$("prev").onclick=()=>go(at-1); $("next").onclick=()=>go(at+1);
document.querySelectorAll("#dots button").forEach(b=>b.onclick=()=>go(+b.dataset.s));
document.addEventListener("keydown",e=>{
  if(e.target.closest("input")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") go(at+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp") go(at-1);
});
const m=/^s(\d+)$/.exec(location.hash.slice(1));
go(m ? +m[1]-1 : 0);
</script>
